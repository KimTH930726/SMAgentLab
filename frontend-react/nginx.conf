server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 실제 사용자 IP(11/06 반입 전 검사) — AWS ALB 뒤에선 연결 주소가 전부 ALB라, 로그인 실패 제한이 한 사람 실수로 전원을 막는다.
    # REAL_IP_FROM(ALB 서브넷, compose → 기동 때 envsubst)에서 온 연결만 X-Forwarded-For를 믿는다. 사용자 PC도 사설 IP라 사설 대역 전체를
    # 믿으면 헤더로 IP를 꾸며 잠금을 피할 수 있다 — ALB 대역만. 기본 127.0.0.1/32 = 꺼짐(ALB 없는 지금과 같음).
    # ALB는 가용 영역마다 서브넷이 있어(최소 2개) 지시어를 두 개 둔다 — 지시어 하나엔 CIDR 하나만(리뷰 M2)
    set_real_ip_from ${REAL_IP_FROM};
    set_real_ip_from ${REAL_IP_FROM_2};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 파일 업로드 한도 (PDF/Excel 등) — 기본 1MB → 50MB
    client_max_body_size 50M;

    # 압축(11/03 성능 리뷰 #10 — 번들 2MB가 그대로 나갔다)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # 보안 헤더(11/03 보안 리뷰 #2) — 스크립트는 이 사이트 것만. 마크다운 sanitize와 이중 방어. 컨플 본문 그림(외부 https)은 허용.
    # nginx는 location에 add_header가 하나라도 있으면 바깥 것을 물려받지 않아, 캐시 헤더를 단 두 location에도 같이 둔다.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # index.html — 항상 최신 버전 (캐시 금지)
    location ~ ^/(?:ops-navi/)?index\.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # assets — 해시 기반 파일명이므로 장기 캐시 허용
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location = /ops-navi {
        rewrite ^ /ops-navi/index.html last;
    }

    location /ops-navi/ {
        rewrite ^/ops-navi/((?:assets/|api/).+|health|favicon\.svg)$ /$1 last;
        rewrite ^ /ops-navi/index.html last;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
